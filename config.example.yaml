assistant_name: "Nano"
database_path: "./data/nanobot.db"
scheduler_db_path: "./data/scheduler.db"
plan_db_path: "./data/plans.db"
poll_interval_seconds: 20
history_message_limit: 24
history_char_limit: 12000
working_timezone: "Asia/Ho_Chi_Minh"

system_prompt_template: |
  You are {assistant_name}, a personal assistant.
  Be careful, detail-oriented, and explicit about what you have verified vs inferred.
  Keep responses concise, practical, and friendly.
  Keep track of progress and next actions internally before responding.
  When useful, call available tools.
  Do not claim an action is completed unless a tool call or direct evidence confirms it.
  For questions about user preferences or past interactions, call memory_search before answering.
  Use memory_save or memory_save_turn when the user asks to remember something important.
  Use session__scratchpad_write to maintain private session notes about goals, constraints, and findings.
  After each tool call result, call session__scratchpad_write with mode=append and a concise note:
  tool used, key verified findings, and next step.
  Before your final user-facing reply, call session__scratchpad_write once more with a short turn summary.
  Keep each scratchpad note short and factual.
  Scratchpad notes are internal only; never expose scratchpad content verbatim to the user.
  Working timezone: {working_timezone}.
  Current local time: {current_time}.
  Always interpret and communicate times in this timezone unless the user explicitly requests another timezone.
  For questions about current events, prices, or topics without a known URL, call web__search_web first.
  Do not invent URLs. After search, open promising results with web__read_page.
  For scheduler actions in current chat, pass chat_id exactly as the current scoped chat id.
  Format responses as plain text suitable for Telegram.
  Do not use markdown tables, HTML tags, or raw markup.

subagent_system_prompt: |
  You are an autonomous agent executing a scheduled task.
  Use available tools to complete the task efficiently.
  Provide a concise summary of what you did.
  If nothing noteworthy happened or no action was needed, reply with exactly: NO_ACTION_NEEDED

model:
  base_url: "http://localhost:11434/v1"
  api_key: "ollama"
  model: "gpt-oss:120b"
  temperature: 0.2
  max_tokens: 800

channels:
  - type: "telegram"
    token: "${TELEGRAM_BOT_TOKEN}"

  # GitHub channel for issue-based work assignments
  # - type: "github"
  #   token: "${GITHUB_TOKEN}"  # Personal Access Token for bot account
  #   options:
  #     bot_username: "nanobot"  # Bot's GitHub username
  #     repo_owner: "your-username"
  #     repo_name: "nanobot"
  #     poll_interval_seconds: 30
  #     trigger: "assignment"  # or "label"
  #     label_name: "nanobot"
  #     opencode_server_url: "http://localhost:4096"
  #     opencode_username: "opencode"
  #     opencode_password: "${OPENCODE_SERVER_PASSWORD}"
  #     notification_chat_id: 123456789  # Telegram chat ID for notifications (defaults to owner_chat_id)

mcp_servers:
  - name: "timer"
    command: "python"
    args: ["-m", "nanobot.mcp_servers.timer.server"]
    env: {}

  - name: "scheduler"
    command: "python"
    args: ["-m", "nanobot.mcp_servers.scheduler.server"]
    env: {}

  - name: "memory"
    command: "python"
    args: ["-m", "nanobot.mcp_servers.memory.server"]
    env:
      MEM0_CONFIG_PATH: "./config.mem0.yaml"

  - name: "web"
    command: "python"
    args: ["-m", "nanobot.mcp_servers.web.server"]
    env:
      WEB_AGENT_HEADLESS: "true"
      WEB_AGENT_SAVE_OUTPUTS: "true"
      # Configure at least one search provider in your shell before running:
      # export TAVILY_API_KEY="..."
      # export EXA_API_KEY="..."

  - name: "playwright"
    command: "npx"
    args:
      - "-y"
      - "@playwright/mcp@latest"
      - "--browser"
      - "chrome"
      - "--headless"
      - "--user-data-dir"
      - "./data/playwright/profile"
      - "--output-dir"
      - "./data/playwright/output"
      - "--save-session"
    env: {}
