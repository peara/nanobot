assistant_name: "Nano"
owner_chat_id: 0
database_path: "./data/nanobot.db"
scheduler_db_path: "./data/scheduler.db"
plan_db_path: "./data/plans.db"
skill_db_path: "./data/skills.db"
prompt_db_path: "./data/prompts.db"
mem0_config_path: "./config.mem0.yaml"
poll_interval_seconds: 20
history_message_limit: 24
history_char_limit: 12000
working_timezone: "Asia/Ho_Chi_Minh"
enable_tool_stats: false
enable_evaluator: false

# Logging configuration — required. See docs/logging.md for full schema.
logging:
  format: "%(asctime)s %(levelname)s %(name)s - %(message)s"
  handlers:
    - name: console
      type: console
      level: INFO
    - name: file
      type: file
      level: DEBUG
      options:
        filepath: "./data/nanobot.log"
        max_bytes: 2000000
        backup_count: 3
        encoding: utf-8
    # Uncomment to isolate evaluator LLM I/O to its own log file:
    # - name: evaluator_file
    #   type: file
    #   level: DEBUG
    #   options:
    #     filepath: "./data/evaluator.log"
    #     max_bytes: 2000000
    #     backup_count: 3
    #     encoding: utf-8
  loggers: {}
    # Uncomment to route evaluator logs to evaluator_file only (propagate=False):
    # nanobot.evaluator.io:
    #   handlers: [evaluator_file]
    #   level: DEBUG

model:
  base_url: "http://localhost:11434/v1"
  api_key: "ollama"
  model: "gpt-oss:120b"
  temperature: 0.2
  max_tokens: 800

channels:
  - type: "telegram"
    token: "${TELEGRAM_BOT_TOKEN}"

  # GitHub channel for issue-based work assignments
  # - type: "github"
  #   token: "${GITHUB_TOKEN}"  # Personal Access Token for bot account
  #   options:
  #     bot_username: "nanobot"  # Bot's GitHub username
  #     repo_owner: "your-username"
  #     repo_name: "nanobot"
  #     poll_interval_seconds: 30
  #     trigger: "assignment"  # or "label"
  #     label_name: "nanobot"
  #     opencode_server_url: "http://localhost:4096"
  #     opencode_username: "opencode"
  #     opencode_password: "${OPENCODE_SERVER_PASSWORD}"
  #     notification_chat_id: 123456789  # Telegram chat ID for notifications (defaults to owner_chat_id)

  # File channel for CLI-based conversations (useful for debugging/testing)
  # - type: "file"
  #   options:
  #     sessions_dir: "./data/chat/sessions"  # Directory for session files
  #     capture_tool_calls: true  # Include tool calls in conversation history
  #     poll_interval: 0.5  # Seconds between file polls
  #     user_id: "user"  # Default user ID for sessions

mcp_servers:
  - name: "timer"
    command: "python"
    args: ["-m", "nanobot.mcp_servers.timer.server"]
    env: {}

  - name: "scheduler"
    command: "python"
    args: ["-m", "nanobot.mcp_servers.scheduler.server"]
    env: {}

  - name: "web"
    command: "python"
    args: ["-m", "nanobot.mcp_servers.web.server"]
    env:
      WEB_AGENT_HEADLESS: "true"
      WEB_AGENT_SAVE_OUTPUTS: "true"
      # Configure at least one search provider in your shell before running:
      # export TAVILY_API_KEY="..."
      # export EXA_API_KEY="..."

  - name: "playwright"
    command: "npx"
    args:
      - "-y"
      - "@playwright/mcp@latest"
      - "--browser"
      - "chrome"
      - "--headless"
      - "--user-data-dir"
      - "./data/playwright/profile"
      - "--output-dir"
      - "./data/playwright/output"
      - "--save-session"
    env: {}

  # Reddit — reads public data via JSON endpoints (no authentication needed).
  # Optionally set REDDIT_USER_AGENT in config.override.yaml for a custom
  # User-Agent string (default: nanobot-reddit/1.0 (by /u/nanobot)).
  - name: "reddit"
    command: "python"
    args: ["-m", "nanobot.mcp_servers.reddit.server"]
    env: {}
