llm:
  provider: openai
  config:
    model: "qwen2.5:7b"
    openai_base_url: "http://127.0.0.1:11434/v1"
    api_key: "ollama"
    temperature: 0.1
    max_tokens: 1200

embedder:
  provider: openai
  config:
    model: "mxbai-embed-large"
    openai_base_url: "http://127.0.0.1:11434/v1"
    api_key: "ollama"
    embedding_dims: 1024

vector_store:
  provider: qdrant
  config:
    path: "./data/web_scripts/qdrant"
    collection_name: "nanobot_web_scripts"
    embedding_model_dims: 1024
