[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanobot"
version = "0.1.0"
description = "Minimal personal assistant bot with Telegram + MCP extensibility"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.60.0",
  "python-telegram-bot>=21.6",
  "PyYAML>=6.0.2",
  "mcp>=1.2.0",
  "croniter>=3.0.3",
  "mem0ai>=1.0.4",
  "PyGithub>=2.3.0",
  "python-dotenv>=1.0.0",
  "beautifulsoup4>=4.12.3",
  "httpx>=0.27.2",
  "playwright>=1.55.0",
  "readability-lxml>=0.8.4.1",
  "selectolax>=0.3.27",
  "trafilatura>=2.0.0",
  "crawl4ai>=0.7.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "basedpyright>=1.39.3",
    "jinja2>=3.1.6",
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.15.4",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires live LM Studio/Qdrant (deselected with '-m \"not integration\"')",
    "persistence: tests data survives across process restarts",
]

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]